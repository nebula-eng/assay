[workspace]
resolver = "2"
members = [
    "crates/assay-core",
    "crates/assay-cli",
    "crates/assay-desktop",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Assay Contributors"]
repository = "https://github.com/nebula-eng/assay"
homepage = "https://github.com/nebula-eng/assay"
documentation = "https://github.com/nebula-eng/assay/tree/main/docs"

[workspace.dependencies]
assay-core = { path = "crates/assay-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rayon = "1"
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false
