name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

# A tag push sets ref_name to the tag; a manual dispatch checks out a branch, so
# the tag has to come from the input instead. Resolved once here so no job has to
# repeat the conditional.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Guard rail: a release that does not pass the suite is not a release.
  verify:
    name: Verify before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The workspace contains the Tauri shell; lints and tests over `--workspace`
      # need the WebKit headers or they fail on pkg-config instead of on code.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # `cargo clippy --workspace` and `cargo test --workspace` both reach the
      # desktop crate, whose build script requires the embedded front-end bundle.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the front end the shell embeds
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --all-targets, matching ci.yml. Without it the benches and examples are
      # never compiled here, so a release can be cut with code that only fails
      # to build under a target nobody ran.
      - run: cargo test --workspace --all-targets

  cli:
    name: CLI binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: assay-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: assay-aarch64-linux.tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: assay-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: assay-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: assay-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p assay-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" assay
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/assay.exe" -DestinationPath "${{ matrix.archive }}"
          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File "${{ matrix.archive }}.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  desktop:
    name: Desktop bundles
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # Dependencies only: `tauri build` runs `beforeBuildCommand`, which is
      # `npm --prefix ../../ui run build`. Building here as well compiled the
      # same bundle twice.
      - name: Install front-end dependencies
        run: npm --prefix ui ci --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/assay-desktop
          args: --release
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Assay ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Static supply-chain analysis for compiled artefacts.

            See [CHANGELOG.md](CHANGELOG.md) for what changed in this release.
          releaseDraft: true
          prerelease: false

  collect:
    name: Collect CLI artefacts
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # Draft, because a human should read the notes before publishing.
          draft: true
          files: artifacts/*
          tag_name: ${{ env.RELEASE_TAG }}
